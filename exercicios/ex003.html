<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            background-color: lightblue;
            font-family:Verdana, Geneva, Tahoma, sans-serif;
        }
    </style>
    <title>Meu primeiro programa</title>
</head>
<body>
    <h1>Olá, Mundo!</h1>
    <p>Me livrei da maldição!</p>
    <script>
     
       alert("Vamos fazer um cálculo!")
       var n1 = Number.parseInt(prompt("Digite o primeiro número:"))
       // (number + number) = "+" Adição
       // (string + string) ] "+" Concatenação       
       var n2 = Number.parseInt(prompt("Digite o segundo número:"))
       // O n2 recebe o valor prompt(string) e converte ele em número(Number.parseInt(n)/Number(n) ou Number.parseFloat(n))
       var resultado = n1 + n2
       alert(`A soma do ${n1} + ${n2} é ${resultado}`)
       // Podemos fazer a conversão de Number para String usando (string(n) ou .toString(n))
    
    
    </script>
</body>
</html>
